name: Chronos RingEngine CI

on:
  push:
  pull_request:

jobs:
  linux-build-and-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libgtest-dev g++
      - name: ASan and UBSan tests
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCHRONOS_ENABLE_SANITIZERS=ON
          cmake --build build-asan --target chronos_tests
          ctest --test-dir build-asan --output-on-failure
      - name: Release build and tests
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --target chronos_tests chronos_mpsc_bench chronos_variant_bench
          ctest --test-dir build-release --output-on-failure

  windows-msys2-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtest
      - name: Configure, build, and test
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build build --target chronos_tests chronos_mpsc_bench chronos_variant_bench
          ctest --test-dir build --output-on-failure
